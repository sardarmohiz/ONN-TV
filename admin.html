<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONN TV | Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .header {
      background: #111;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
    }

    .logo span {
      background: #c40000;
      padding: 3px 7px;
      margin-left: 5px;
    }

    .container {
      width: min(1100px, 94%);
      margin: 30px auto;
    }

    .login-box,
    .admin-box {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    .login-box {
      max-width: 500px;
      margin: 80px auto;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 5px;
    }

    .github-btn {
      background: #111;
      color: white;
      width: 100%;
    }

    .logout-btn {
      background: #c40000;
      color: white;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      gap: 25px;
      margin: 15px 0;
    }

    .checkbox-row label {
      display: flex;
      gap: 7px;
      align-items: center;
      font-weight: normal;
    }

    .checkbox-row input {
      width: auto;
    }

    .publish-btn {
      background: #c40000;
      color: white;
      width: 100%;
      font-size: 16px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 5px;
      display: none;
    }

    .success {
      display: block;
      background: #e8f7e8;
      color: #176b17;
    }

    .error {
      display: block;
      background: #ffe8e8;
      color: #a00000;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    #adminPanel {
      display: none;
    }

    @media(max-width:600px) {
      .admin-header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }

      .checkbox-row {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="logo">
    ONN <span>TV</span>
  </div>

  <div>ADMIN PANEL</div>
</header>


<div class="container">


  <!-- LOGIN -->

  <div class="login-box" id="loginBox">

    <h1>ONN TV Admin</h1>

    <p class="subtitle">
      Sign in to manage ONN TV news
    </p>

    <button class="github-btn" id="loginBtn">
      Continue with GitHub
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- ADMIN PANEL -->

  <div id="adminPanel">

    <div class="admin-box">

      <div class="admin-header">

        <div>
          <h1>Add News</h1>
          <p class="subtitle">
            Publish a new article to ONN TV
          </p>
        </div>

        <button class="logout-btn" id="logoutBtn">
          Logout
        </button>

      </div>


      <form id="newsForm">


        <div class="form-group">

          <label for="title">
            News Title
          </label>

          <input
            type="text"
            id="title"
            placeholder="Enter news headline"
            required
          >

        </div>


        <div class="form-group">

          <label for="category">
            Category
          </label>

          <select id="category" required>

            <option value="">
              Select Category
            </option>

            <option value="Pakistan">
              Pakistan
            </option>

            <option value="Politics">
              Politics
            </option>

            <option value="World">
              World
            </option>

            <option value="Sports">
              Sports
            </option>

            <option value="Business">
              Business
            </option>

            <option value="Technology">
              Technology
            </option>

            <option value="Entertainment">
              Entertainment
            </option>

            <option value="Health">
              Health
            </option>

            <option value="Weather">
              Weather
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="excerpt">
            Short Description
          </label>

          <textarea
            id="excerpt"
            placeholder="Write a short description..."
          ></textarea>

        </div>


        <div class="form-group">

          <label for="content">
            Full Article
          </label>

          <textarea
            id="content"
            placeholder="Write the complete news article..."
            required
          ></textarea>

        </div>


        <div class="form-group">

          <label for="image">
            News Image
          </label>

          <input
            type="file"
            id="image"
            accept="image/*"
          >

        </div>


        <div class="checkbox-row">

          <label>
            <input
              type="checkbox"
              id="breaking"
            >
            Breaking News
          </label>


          <label>
            <input
              type="checkbox"
              id="featured"
            >
            Featured News
          </label>


          <label>
            <input
              type="checkbox"
              id="published"
              checked
            >
            Publish Now
          </label>

        </div>


        <button
          type="submit"
          class="publish-btn"
        >
          Publish News
        </button>


        <div
          id="formMessage"
          class="message"
        ></div>


      </form>

    </div>

  </div>

</div>


<script>

  /*
   * ==========================================
   * ONN TV SUPABASE CONFIG
   * ==========================================
   *
   * IMPORTANT:
   * Put your Supabase PROJECT URL and
   * PUBLISHABLE/ANON KEY here.
   *
   * Never put the service_role/secret key here.
   */

  const SUPABASE_URL = "YOUR_SUPABASE_URL";

  const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const loginBox =
    document.getElementById("loginBox");

  const adminPanel =
    document.getElementById("adminPanel");


  const loginMessage =
    document.getElementById("loginMessage");


  const formMessage =
    document.getElementById("formMessage");


  /*
   * LOGIN
   */

  document
    .getElementById("loginBtn")
    .addEventListener("click", async () => {

      const { error } =
        await supabaseClient.auth.signInWithOAuth({

          provider: "github",

          options: {
            redirectTo: window.location.href
          }

        });


      if (error) {

        loginMessage.textContent =
          error.message;

        loginMessage.className =
          "message error";

      }

    });


  /*
   * LOGOUT
   */

  document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

      await supabaseClient.auth.signOut();

      window.location.reload();

    });


  /*
   * CHECK USER
   */

  async function checkUser() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();


    if (user) {

      loginBox.style.display =
        "none";

      adminPanel.style.display =
        "block";

    } else {

      loginBox.style.display =
        "block";

      adminPanel.style.display =
        "none";

    }

  }


  /*
   * CREATE SLUG
   */

  function createSlug(text) {

    return text
      .toLowerCase()
      .trim()
      .replace(/[^\w\s-]/g, "")
      .replace(/\s+/g, "-")
      .replace(/-+/g, "-");

  }


  /*
   * PUBLISH NEWS
   */

  document
    .getElementById("newsForm")
    .addEventListener("submit", async (event) => {

      event.preventDefault();


      formMessage.className =
        "message";

      formMessage.textContent =
        "Publishing news...";

      formMessage.style.display =
        "block";


      const title =
        document
          .getElementById("title")
          .value
          .trim();


      const excerpt =
        document
          .getElementById("excerpt")
          .value
          .trim();


      const content =
        document
          .getElementById("content")
          .value
          .trim();


      const category =
        document
          .getElementById("category")
          .value;


      const imageFile =
        document
          .getElementById("image")
          .files[0];


      const breaking =
        document
          .getElementById("breaking")
          .checked;


      const featured =
        document
          .getElementById("featured")
          .checked;


      const published =
        document
          .getElementById("published")
          .checked;


      let imageUrl = null;


      /*
       * IMAGE UPLOAD
       */

      if (imageFile) {

        const fileExtension =
          imageFile.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2) +
          "." +
          fileExtension;


        const filePath =
          "news/" + fileName;


        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("news-images")
            .upload(
              filePath,
              imageFile,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (uploadError) {

          formMessage.textContent =
            "Image upload failed: " +
            uploadError.message;

          formMessage.className =
            "message error";

          return;

        }


        const {
          data: publicUrlData
        } =
          supabaseClient
            .storage
            .from("news-images")
            .getPublicUrl(filePath);


        imageUrl =
          publicUrlData.publicUrl;

      }


      /*
       * SAVE NEWS
       */

      const slug =
        createSlug(title) +
        "-" +
        Date.now();


      const {
        error: insertError
      } =
        await supabaseClient
          .from("news")
          .insert({

            title: title,

            slug: slug,

            excerpt: excerpt,

            content: content,

            category: category,

            image_url: imageUrl,

            author: "ONN TV",

            is_breaking: breaking,

            is_featured: featured,

            published: published

          });


      if (insertError) {

        formMessage.textContent =
          "News save failed: " +
          insertError.message;

        formMessage.className =
          "message error";

        return;

      }


      formMessage.textContent =
        "News published successfully!";

      formMessage.className =
        "message success";


      document
        .getElementById("newsForm")
        .reset();


      document
        .getElementById("published")
        .checked = true;

    });


  /*
   * START
   */

  checkUser();

</script>

</body>
</html>
